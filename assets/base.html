<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page title</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa; --paper: #fff; --fg: #202c38; --muted: #526171;
      --accent: #245fa0; --line: #ccd5de; --soft: #eaf0f6;
      --body: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #172029; --paper: #1c2833; --fg: #e4ecf3; --muted: #aab9c7;
        --accent: #8abdf0; --line: #41515f; --soft: #263643;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.75 var(--body); }
    main { max-width: 1060px; margin: auto; padding: clamp(24px, 5vw, 64px) clamp(20px, 4vw, 48px) 80px; }
    header { margin-bottom: 40px; }
    h1, h2, h3 { line-height: 1.3; text-wrap: balance; }
    h1 { font-size: clamp(28px, 4vw, 44px); margin: 0 0 16px; }
    h2 { font-size: 24px; margin: 0 0 16px; }
    h3 { font-size: 18px; margin: 0 0 12px; }
    p { max-width: 68ch; margin: 0 0 16px; }
    section + section { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--line); }
    .lede { font-size: 18px; color: var(--muted); }
    .muted, figcaption { color: var(--muted); }
    .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .columns > * { min-width: 0; }
    a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    ul, ol { padding-left: 1.4em; }
    li + li { margin-top: 6px; }
    code, pre { font-family: var(--mono); font-size: .9em; }
    code { overflow-wrap: anywhere; }
    pre { background: var(--soft); padding: 16px; overflow-x: auto; line-height: 1.6; }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: var(--soft); }
    .number { font-variant-numeric: tabular-nums; text-align: right; }
    figure { margin: 24px 0; }
    svg { max-width: 100%; height: auto; }
    figcaption { font-size: 14px; margin-top: 10px; }
    details { border-block: 1px solid var(--line); padding: 12px 0; }
    summary { cursor: pointer; font-weight: 600; }
    details[open] summary { margin-bottom: 12px; }
    @media (max-width: 680px) { .columns { grid-template-columns: 1fr; } }
    @media print {
      :root { color-scheme: light; --bg: #fff; --paper: #fff; --fg: #17212b; --muted: #495563; --accent: #174e85; --line: #bbc5cf; --soft: #f0f3f6; }
      main { max-width: none; padding: 0; }
      h1, h2, h3 { break-after: avoid; }
      figure, tr { break-inside: avoid; }
      .scroll { overflow: visible; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      table { table-layout: fixed; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Page title</h1>
      <p class="lede">State the main takeaway in one sentence.</p>
    </header>
    <section aria-labelledby="content-title">
      <h2 id="content-title">Section title</h2>
      <p>Replace with real content and adapt the layout to its relationships.</p>
    </section>
  </main>
</body>
</html>
