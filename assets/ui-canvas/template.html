<!doctype html>
<html lang="@@LANG@@">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@TITLE@@</title>
  <style>
    :root { color-scheme: light; --ink:#24262b; --muted:#717680; --border:#e6e7eb; --accent:#5865d8; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#e9eaed; font:13px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    button { font:inherit; color:inherit; cursor:pointer; }
    button:focus-visible, canvas:focus-visible, summary:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
    button { border:0; border-radius:6px; background:transparent; padding:7px 10px; }
    button:hover { background:#f0f1f6; }
    [hidden] { display:none!important; }
    .stage { height:100vh; height:100dvh; position:relative; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; touch-action:none; outline:0; }
    canvas.panning { cursor:grabbing; }
    .loading { position:absolute; inset:40% 12% auto; text-align:center; padding:24px; border-radius:12px; background:#fff; box-shadow:0 8px 40px #0001; }
    .zoom { position:absolute; right:18px; bottom:18px; display:flex; gap:2px; background:#fff; padding:4px; border:1px solid var(--border); border-radius:9px; box-shadow:0 2px 8px #0001; }
    .zoom button { min-width:32px; }
    #fit-all { border-left:1px solid var(--border); border-radius:0 6px 6px 0; }
    .outline { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); background:#fff; }
    .outline:focus-within, body[data-error] .outline { position:relative; width:auto; height:auto; clip-path:none; padding:24px; }
    .outline p { color:var(--muted); max-width:75ch; }
    .outline li { margin:5px 0; overflow-wrap:anywhere; }
    .outline summary { cursor:pointer; }
    .licenses { white-space:pre-wrap; font:11px/1.5 ui-monospace,monospace; max-height:360px; overflow:auto; }
    @media print {
      .stage { display:none; }
      .outline { position:static; width:auto; height:auto; clip-path:none; padding:0; overflow:visible; }
      .licenses { max-height:none; }
      .outline details > * { display:block!important; } .outline details > summary { display:none; }
    }
  </style>
  <noscript><style>
    .stage { display:none; }
    .outline { position:static; width:auto; height:auto; clip-path:none; padding:24px; overflow:visible; }
  </style></noscript>
</head>
<body>
    <main id="stage" class="stage">
      <canvas id="design-canvas" tabindex="0" aria-label="@@CANVAS_LABEL@@"></canvas>
      <div id="loading" class="loading" role="status">@@LOADING@@</div>
      <div class="zoom" role="group" aria-label="@@ZOOM@@">
        <button id="zoom-out" aria-label="@@ZOOM_OUT@@">−</button>
        <button id="zoom-level" title="100%">100%</button>
        <button id="zoom-in" aria-label="@@ZOOM_IN@@">+</button>
        <button id="fit-all" title="@@HELP@@" aria-label="@@FIT_ALL@@">@@FIT_ALL@@</button>
      </div>
    </main>
  <section class="outline">
    <h2>@@TITLE@@</h2><p>@@DESCRIPTION@@</p>
    <noscript><p>@@NOSCRIPT@@</p></noscript>
    <details><summary>@@OUTLINE@@</summary>@@CONTENT_OUTLINE@@</details>
    <details><summary>@@LICENSES_LABEL@@</summary><pre class="licenses">@@LICENSES@@</pre></details>
  </section>
  <script type="application/json" id="scene-data">@@SCENE@@</script>
  <script type="application/json" id="runtime-assets">@@ASSETS@@</script>
  <script type="application/octet-stream" id="canvas-runtime">@@RUNTIME@@</script>
  <script>
    function canvasBootError(error) {
      if (document.body.dataset.ready) return;
      document.getElementById('loading').textContent = '@@BOOT_ERROR@@';
      document.body.dataset.error = error?.message || 'Runtime initialization failed';
    }
    window.addEventListener('error', event => canvasBootError(event.error));
    window.addEventListener('unhandledrejection', event => canvasBootError(event.reason));
    let printDetails = [];
    window.addEventListener('beforeprint', () => {
      printDetails = [...document.querySelectorAll('.outline details')].map(el => [el, el.open]);
      printDetails.forEach(([el]) => { el.open = true; });
    });
    window.addEventListener('afterprint', () => {
      printDetails.forEach(([el, open]) => { el.open = open; });
    });
    window.unpackCanvasAsset = async (base64) => {
      const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      return new Uint8Array(await new Response(
        new Blob([data]).stream().pipeThrough(new DecompressionStream('gzip'))
      ).arrayBuffer());
    };
    (async () => {
      try {
        const code = await window.unpackCanvasAsset(document.getElementById('canvas-runtime').textContent.trim());
        const script = document.createElement('script');
        script.type = 'module';
        script.textContent = new TextDecoder().decode(code);
        document.body.append(script);
      } catch (error) {
        document.getElementById('loading').textContent = '@@BOOT_ERROR@@';
        document.body.dataset.error = error.message;
        console.error(error);
      }
    })();
  </script>
</body>
</html>
